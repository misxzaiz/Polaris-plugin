<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polaris 插件商城 · 排序能力可交互原型</title>
<style>
  /* ===== 忠实还原 Panel.tsx 暗色风格 ===== */
  :root {
    --bg: #1A1A1F;
    --card: #25252B;
    --card-hover: #2A2A30;
    --card-selected: #2D2D33;
    --panel: #1F1F24;
    --border: #3F3F46;
    --text: #F8F8F8;
    --text-2: #B4B4B8;
    --text-3: #8E8E93;
    --text-4: #6B7280;
    --accent: #3B82F6;
    --green: #34D399;
    --blue: #60A5FA;
    --gray: #6B7280;
    --red: #EF4444;
    --amber: #F59E0B;
    /* tier 配色 */
    --prod-c: #34D399; --prod-bg: #065F4622; --prod-bd: #065F4644;
    --beta-c: #60A5FA; --beta-bg: #1E40AF22; --beta-bd: #1E40AF44;
    --demo-c: #6B7280; --demo-bg: #3F3F4622; --demo-bd: #3F3F4644;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0F0F12;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 12px;
  }
  .mock-shell {
    width: 100%;
    max-width: 480px;
    height: 760px;
    background: var(--bg);
    border-radius: 12px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  /* ===== 顶部说明条（原型专属，非真实 UI） ===== */
  .mock-note {
    background: #2D1B00;
    color: var(--amber);
    font-size: 10px;
    padding: 6px 12px;
    line-height: 1.5;
    border-bottom: 1px solid #4D3A00;
  }
  .mock-note b { color: #FBBF24; }
  /* ===== Tab ===== */
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab-btn {
    flex: 1; padding: 10px 12px; font-size: 12px; cursor: pointer;
    border: none; background: transparent; color: var(--text-3);
    border-bottom: 2px solid transparent; font-weight: 400;
  }
  .tab-btn.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  /* ===== 搜索栏 ===== */
  .search-row { padding: 12px 12px 8px; display: flex; gap: 8px; align-items: center; }
  .search-row input {
    flex: 1; padding: 6px 10px; background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px; outline: none;
  }
  .icon-btn {
    padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: #2D2D33; color: var(--text); font-size: 12px; cursor: pointer;
  }
  /* ===== 源 chips ===== */
  .source-bar { padding: 0 12px 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .source-bar .label { font-size: 10px; color: var(--text-4); margin-right: 2px; }
  .chip-src {
    font-size: 10px; padding: 2px 8px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text-3);
  }
  .chip-src.active { border-color: var(--accent); background: #3B82F622; color: var(--accent); }
  /* ===== 过滤栏 + 排序 ===== */
  .filter-row { padding: 0 12px 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filter-row .sep { width: 1px; height: 14px; background: var(--border); margin: 0 2px; }
  .filter-row .label { font-size: 10px; color: var(--text-4); margin-right: 2px; }
  .chip-filter {
    font-size: 10px; padding: 2px 8px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text-3);
    transition: background 0.15s, color 0.15s;
  }
  .chip-filter.active { background: #6B728022; color: var(--text-4); border-color: var(--text-4); }
  .chip-filter.active.tier-prod { background: var(--prod-bg); color: var(--prod-c); border-color: var(--prod-c); }
  .chip-filter.active.tier-beta { background: var(--beta-bg); color: var(--beta-c); border-color: var(--beta-c); }
  .chip-filter.active.tier-demo { background: var(--demo-bg); color: var(--demo-c); border-color: var(--demo-c); }
  .chip-filter.active.cat-ai { background: #8B5CF622; color: #A855F7; border-color: #A855F7; }
  /* 排序下拉 */
  .sort-wrap { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .sort-wrap .label { font-size: 10px; color: var(--text-4); }
  .sort-select {
    font-size: 10px; padding: 3px 8px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text-2);
    outline: none;
  }
  .sort-select.active { border-color: var(--accent); color: var(--accent); background: #3B82F622; }
  /* ===== 提示条 ===== */
  .tip-bar {
    margin: 0 12px 6px; padding: 4px 8px; border-radius: 4px;
    background: #3F3F4622; font-size: 10px; color: var(--text-4); line-height: 1.4;
  }
  .tip-bar strong { color: var(--text-4); }
  /* ===== 列表 ===== */
  .list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .group-label {
    font-size: 10px; font-weight: 600; color: var(--text-4);
    margin-bottom: 6px; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .group-label .count { color: var(--text-4); font-weight: 400; margin-left: 4px; }
  .item {
    display: flex; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer;
    margin-bottom: 6px; border: 1px solid transparent; background: var(--card);
    transition: opacity 0.15s, background 0.15s;
  }
  .item:hover { background: var(--card-hover); }
  .item.selected { border-color: var(--accent); background: var(--card-selected); }
  .item.demo { opacity: 0.55; }
  .item-icon {
    width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-size: 14px; flex-shrink: 0; margin-top: 2px;
  }
  .item-body { flex: 1; min-width: 0; }
  .item-title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .item-name { font-size: 13px; font-weight: 600; }
  .item.demo .item-name { color: var(--text-4); }
  .item-ver { font-size: 10px; color: var(--text-4); }
  .item-desc {
    font-size: 11px; margin-top: 3px; line-height: 1.4; color: var(--text-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item.demo .item-desc { color: var(--text-4); }
  .item-time {
    font-size: 9px; color: var(--text-4); margin-top: 4px;

  /* 排序非默认时显示时间行 */

  .item-tags { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .tag {
    font-size: 9px; padding: 1px 6px; border-radius: 4px;

  .tier-production { background: var(--prod-bg); color: var(--prod-c); border: 1px solid var(--prod-bd); }

</style>

  { id:'maian', name:'脉案', version:'0.1.0', tier:'beta', category:'ai',

    createdAt:'2026-10-28T22:00:00Z', updatedAt:'2026-10-28T22:00:00Z', tags:['健康','体征'] },
  { id:'xintu', name:'心图', version:'0.1.0', tier:'beta', category:'ai',
    icon:'🗺️', desc:'AI 画布：MCP 六工具 / 人机共编画布 / 索引驱动无 list。',
    createdAt:'2026-10-26T19:00:00Z', updatedAt:'2026-10-26T19:00:00Z', tags:['画布','mcp'] },

const TIER_LABEL = { production:'生产可用', beta:'测试阶段', demo:'演示玩具' };
const TIER_BADGE = { production:'tier-production', beta:'tier-beta', demo:'tier-demo' };
const TIER_CFG = {
  production: { label:'Production', color:'#34D399', bg:'#065F4622' },
  beta:       { label:'Beta',       color:'#60A5FA', bg:'#1E40AF22' },
  demo:       { label:'Demo',       color:'#6B7280', bg:'#3F3F4622' },
};
const CAT_COLOR = {
  ai:'#A855F7', dev:'#F59E0B', utility:'#3B82F6', media:'#EC4899', fun:'#EC4899',
};

/* ===== 状态 ===== */
let state = {
  query: '',
  tierFilter: 'all',
  category: '',
  sort: 'default',
  selectedId: null,
};

/* ===== 排序：组内排序（保留 tier 分组） =====
   缺字段兜底：updatedAt 缺失 → 回退 createdAt → 再缺失 → 1970（最旧优先时排末尾）
   为"最新优先"时把缺字段项排到该组最末（视为未知而非最旧，避免淹没在最旧区） */
function sortPlugins(list, sort) {
  if (sort === 'default') return list;
  const [field, dir] = sort.split('-'); // field: updated|created, dir: desc|asc
  const key = field === 'updated' ? 'updatedAt' : 'createdAt';
  const hasTime = p => p[key] || p.createdAt; // updated 缺失回退 created
  const timeOf = p => {
    const v = p[key] || (field === 'updated' ? p.createdAt : null);
    return v ? new Date(v).getTime() : null;
  };
  // 有时间的优先参与排序，无时间的固定排末尾（无论升降序，都视为"未知"区在最后）
  const withTime = list.filter(hasTime);
  const without = list.filter(p => !hasTime(p));
  withTime.sort((a, b) => {
    const ta = timeOf(a), tb = timeOf(b);
    return dir === 'desc' ? tb - ta : ta - tb;
  });
  return [...withTime, ...without];
}

/* ===== 过滤 ===== */
function filterPlugins() {
  return PLUGINS.filter(p => {
    if (state.tierFilter !== 'all' && p.tier !== state.tierFilter) return false;
    if (state.category && p.category !== state.category) return false;
    if (state.query.trim()) {
      const q = state.query.toLowerCase();
      const hay = [p.id, p.name, p.desc, (p.tags||[]).join(' ')].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ===== 渲染 ===== */
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function fmtFull(iso) {
  if (!iso) return '（未记录）';
  const d = new Date(iso);
  return d.toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');
}

function render() {
  const listEl = document.getElementById('list');
  const filtered = filterPlugins();
  const grouped = { production: [], beta: [], demo: [] };
  for (const p of filtered) grouped[p.tier]?.push(p);

  // 排序态：组内重排 + 显示时间行
  const showTime = state.sort !== 'default';
  listEl.classList.toggle('show-time', showTime);
  document.getElementById('sort').classList.toggle('active', showTime);

  const tierOrder = ['production', 'beta', 'demo'];
  const hasAny = tierOrder.some(t => grouped[t].length > 0);

  if (!hasAny) {
    listEl.innerHTML = '<div class="empty">未找到匹配插件</div>';
    renderDetail(null);
    return;
  }

  let html = '';
  for (const tier of tierOrder) {
    const list = sortPlugins(grouped[tier], state.sort);
    if (list.length === 0) continue;
    const cfg = TIER_CFG[tier];
    html += `<div class="group-label" style="color:${cfg.color}">${cfg.label}<span class="count" style="color:var(--text-4);font-weight:400">${TIER_LABEL[tier]} · ${list.length}</span></div>`;
    for (const p of list) {
      const sel = state.selectedId === p.id ? 'selected' : '';
      const dm = p.tier === 'demo' ? 'demo' : '';
      // 时间行：依据当前排序字段显示对应时间；缺字段显示红色提示
      let timeLine = '';
      if (showTime) {
        const field = state.sort.startsWith('updated') ? 'updated' : 'created';
        const key = field === 'updated' ? 'updatedAt' : 'createdAt';
        const v = p[key] || (field === 'updated' ? p.createdAt : null);
        timeLine = v
          ? `<div class="item-time">${field === 'updated' ? '更新于' : '创建于'} ${fmtDate(v)}</div>`
          : `<div class="item-time missing-time">ⓘ 时间未知（索引缺字段，兜底归入末尾）</div>`;
      }
      const catColor = CAT_COLOR[p.category] || '#6B7280';
      html += `
        <div class="item ${sel} ${dm}" onclick="selectPlugin('${p.id}')">
          <div class="item-icon" style="background:${cfg.bg};color:${cfg.color}">${p.icon}</div>
          <div class="item-body">
            <div class="item-title">
              <span class="item-name">${p.name}</span>
              <span class="item-ver">v${p.version}</span>
              <span class="tier-badge ${TIER_BADGE[tier]}"><span class="dot"></span>${cfg.label}</span>
            </div>
            <div class="item-desc">${p.desc}</div>
            ${timeLine}
            <div class="item-tags">
              ${p.category ? `<span class="tag" style="background:${catColor}33;color:${catColor}">${p.category}</span>` : ''}
              ${(p.tags||[]).slice(0,2).map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
          </div>
        </div>`;
    }
  }
  listEl.innerHTML = html;
  renderDetail(state.selectedId);
}

function renderDetail(id) {
  const el = document.getElementById('detail');
  if (!id) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const p = PLUGINS.find(x => x.id === id);
  if (!p) { el.style.display = 'none'; return; }
  const cfg = TIER_CFG[p.tier];
  el.style.display = 'flex';
  el.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-name">${p.name} <span class="tier-badge ${TIER_BADGE[p.tier]}"><span class="dot"></span>${cfg.label}</span></div>
        <div class="detail-meta">${p.id} · v${p.version}</div>
      </div>
      <button class="detail-close" onclick="selectPlugin(null)">✕</button>
    </div>
    <div class="detail-desc">${p.desc}</div>
    <div class="detail-time">
      <b>创建时间：</b>${fmtFull(p.createdAt)}<br/>
      <b>最后更新：</b>${p.updatedAt ? fmtFull(p.updatedAt) : '（未记录，回退创建时间）'}
    </div>
    <div class="btn-row">
      <button class="btn-primary">安装到 User</button>
      <button class="btn-primary">安装到 Project</button>
    </div>`;
}

function selectPlugin(id) {
  state.selectedId = id;
  render();
}

/* ===== 事件绑定 ===== */
document.getElementById('search').addEventListener('input', e => {
  state.query = e.target.value; render();
});
document.getElementById('sort').addEventListener('change', e => {
  state.sort = e.target.value; render();
});
document.querySelectorAll('.chip-filter[data-tier]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.tierFilter = btn.dataset.tier;
    document.querySelectorAll('.chip-filter[data-tier]').forEach(b => {
      b.classList.remove('active','tier-prod','tier-beta','tier-demo');
    });
    btn.classList.add('active');
    if (btn.dataset.tier === 'production') btn.classList.add('tier-prod');
    else if (btn.dataset.tier === 'beta') btn.classList.add('tier-beta');
    else if (btn.dataset.tier === 'demo') btn.classList.add('tier-demo');
    else btn.classList.add('tier-prod'); // all 用绿色高亮复用
    render();
  });
});
document.querySelectorAll('.chip-filter[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.category = btn.dataset.cat;
    document.querySelectorAll('.chip-filter[data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

/* 初始化 */
render();
</script>
</body>
</html>
