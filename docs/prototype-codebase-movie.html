<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Codebase Movie · 原型</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f14;
      --surface: #1a1a24;
      --surface2: #24243a;
      --border: #2a2a40;
      --text: #e0e0f0;
      --text2: #9090b0;
      --accent: #6c6cff;
      --accent2: #ff6b9d;
      --accent3: #4fc3f7;
      --green: #4caf7d;
      --red: #ef5350;
      --gold: #ffc107;
      --radius: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 8px);
    }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ===== App Shell ===== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 52px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
    }
    .header-sub {
      font-size: 11px;
      color: var(--text2);
      margin-top: 1px;
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .header-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: var(--surface2);
      color: var(--text2);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .header-btn:active { background: var(--border); transform: scale(0.92); }

    /* ===== Timeline Canvas Container ===== */
    .timeline-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    #timelineCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* ===== Playback Controls ===== */
    .playback-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .play-btn:active { transform: scale(0.9); }
    .play-btn.playing { background: linear-gradient(135deg, var(--accent3), var(--accent)); }

    .speed-btns {
      display: flex;
      gap: 4px;
    }
    .speed-btn {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .speed-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .speed-btn:active { transform: scale(0.95); }

    .progress-bar {
      flex: 1;
      position: relative;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      cursor: pointer;
      min-width: 60px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
    }
    .progress-label {
      font-size: 11px;
      color: var(--text2);
      min-width: 48px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ===== Bottom Sheet (Scene Detail) ===== */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 10;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
    }
    .bottom-sheet.open {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      margin: 8px auto;
      flex-shrink: 0;
    }
    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 4px 16px 12px;
      flex-shrink: 0;
    }
    .sheet-commit-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      flex: 1;
    }
    .sheet-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--surface2);
      color: var(--text2);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sheet-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 12px;
      font-size: 12px;
      color: var(--text2);
      flex-shrink: 0;
    }
    .sheet-meta span { display: flex; align-items: center; gap: 4px; }
    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .sheet-body::-webkit-scrollbar { width: 3px; }
    .sheet-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* File Change List */
    .file-list { margin-bottom: 16px; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .file-item:last-child { border-bottom: none; }
    .file-name {
      flex: 1;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      opacity: 0.9;
    }
    .file-stat {
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .file-stat.add { color: var(--green); }
    .file-stat.del { color: var(--red); }
    .file-stat.mod { color: var(--gold); }
    .file-diff {
      display: none;
      padding: 8px;
      margin-top: 4px;
      background: var(--bg);
      border-radius: 8px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre;
    }
    .file-item.open .file-diff { display: block; }
    .diff-add { color: var(--green); }
    .diff-del { color: var(--red); }

    /* AI Narration */
    .narration {
      background: linear-gradient(135deg, rgba(108,108,255,0.08), rgba(255,107,157,0.08));
      border: 1px solid rgba(108,108,255,0.2);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .narration-label {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .narration-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }

    /* Branch Context Tags */
    .branch-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .branch-tag {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .branch-tag.main { border-color: var(--accent); color: var(--accent); }
    .branch-tag.feat { border-color: var(--accent3); color: var(--accent3); }
    .branch-tag.fix { border-color: var(--gold); color: var(--gold); }

    /* ===== Overlay ===== */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .sheet-overlay.show { opacity: 1; pointer-events: auto; }

    /* ===== Tooltip (idle hint) ===== */
    .hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      color: var(--text2);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }
    .hint.show { opacity: 1; }

    /* ===== Responsive ===== */
    @media (min-width: 481px) {
      #app {
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="header-icon">🎬</div>
      <div>
        <h1>Codebase Movie</h1>
        <div class="header-sub">Polaris-plugin · 42 commits</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="toggleSearch()" aria-label="搜索">🔍</button>
      <button class="header-btn" onclick="toggleExport()" aria-label="导出">📤</button>
    </div>
  </header>

  <!-- Timeline -->
  <div class="timeline-area" id="timelineArea">
    <canvas id="timelineCanvas"></canvas>
    <div class="hint" id="hint">👆 点击节点查看提交详情</div>
  </div>

  <!-- Playback Bar -->
  <div class="playback-bar">
    <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="播放/暂停">▶</button>
    <div class="speed-btns">
      <button class="speed-btn active" onclick="setSpeed(1)">1×</button>
      <button class="speed-btn" onclick="setSpeed(2)">2×</button>
      <button class="speed-btn" onclick="setSpeed(4)">4×</button>
      <button class="speed-btn" onclick="setSpeed(8)">8×</button>
    </div>
    <div class="progress-bar" id="progressBar" onclick="seekProgress(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">0/42</div>
  </div>
</div>

<!-- Overlay + Bottom Sheet -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-commit-title" id="sheetTitle">feat: 添加用户权限管理系统</div>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-meta" id="sheetMeta">
    <span>👤 alice</span>
    <span>🕐 2026-03-15 14:23</span>
    <span>📍 a1b2c3d</span>
  </div>
  <div class="sheet-body" id="sheetBody">
    <!-- content rendered by JS -->
  </div>
</div>

// =====================================================================
//  State
// =====================================================================
const state = {
  commits: COMMITS,
  currentIndex: 0,
  isPlaying: false,
  speed: 1,
  animId: null,
  lastFrame: 0,
};

// =====================================================================
//  Canvas Rendering
// =====================================================================
const canvas = document.getElementById('timelineCanvas');
const ctx = canvas.getContext('2d');
const area = document.getElementById('timelineArea');

let dpr = 1;
let W = 0, H = 0;
let scrollX = 0;
let isDragging = false, dragStartX = 0, dragStartScroll = 0;
const NODE_R = 6;
const BRANCH_H = 36;
const TOP_PAD = 20;
const LEFT_PAD = 60;  // branch labels
const RIGHT_PAD = 20;
const MONTH_W = 120;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const rect = area.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  draw();
}
window.addEventListener('resize', resize);

// Branch colors
const BRANCH_COLORS = {
  'main': { line: '#6c6cff', node: '#6c6cff', bg: 'rgba(108,108,255,0.15)' },
  'feat-plugin': { line: '#4fc3f7', node: '#4fc3f7', bg: 'rgba(79,195,247,0.15)' },
  'fix-logger': { line: '#ffc107', node: '#ffc107', bg: 'rgba(255,193,7,0.15)' },
  'feat-db': { line: '#4caf7d', node: '#4caf7d', bg: 'rgba(76,175,125,0.15)' },
  'fix-race': { line: '#ff6b9d', node: '#ff6b9d', bg: 'rgba(255,107,157,0.15)' },
  'fix-ws': { line: '#ffc107', node: '#ffc107', bg: 'rgba(255,193,7,0.15)' },
  'feat-gql': { line: '#4fc3f7', node: '#4fc3f7', bg: 'rgba(79,195,247,0.15)' },
};
const DEFAULT_BRANCH_COLOR = { line: '#9090b0', node: '#9090b0', bg: 'rgba(144,144,176,0.15)' };

// Collect unique branches in order
function getBranches() {
  const seen = new Set();
  const branches = [];
  for (const c of state.commits) {
    if (!seen.has(c.branch)) {
      seen.add(c.branch);
      branches.push(c.branch);
    }
  }
  // Ensure main is first
  const mainIdx = branches.indexOf('main');
  if (mainIdx > 0) { branches.splice(mainIdx, 1); branches.unshift('main'); }
  return branches;
}

function getBranchY(branch, branches) {
  const idx = branches.indexOf(branch);
  return TOP_PAD + idx * BRANCH_H + 20;
}

function getCommitX(index) {
  return LEFT_PAD + index * 28;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const branches = getBranches();
  const totalW = LEFT_PAD + state.commits.length * 28 + RIGHT_PAD;
  const viewW = W;

  // Draw background grid
  ctx.strokeStyle = 'rgba(42,42,64,0.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= state.commits.length; i += 5) {
    const x = getCommitX(i) - scrollX;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  // Draw month labels
  ctx.fillStyle = '#606080';
  ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  let lastMonth = '';
  for (let i = 0; i < state.commits.length; i++) {
    const month = state.commits[i].date.slice(0, 7);
    if (month !== lastMonth) {
      const x = getCommitX(i) - scrollX;
      ctx.fillText(month, x, 12);
      lastMonth = month;
    }
  }

  // Draw branch labels + lines
  for (const branch of branches) {
    const y = getBranchY(branch, branches);
    const color = BRANCH_COLORS[branch] || DEFAULT_BRANCH_COLOR;

    // Label
    ctx.fillStyle = color.node;
    ctx.font = '600 10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(branch, LEFT_PAD - 8, y + 4);

    // Line
    ctx.strokeStyle = color.line;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    ctx.beginPath();
    const firstX = getCommitX(0) - scrollX;
    const lastX = getCommitX(state.commits.length - 1) - scrollX;
    ctx.moveTo(firstX, y);
    ctx.lineTo(lastX, y);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Nodes
    for (let i = 0; i < state.commits.length; i++) {
      if (state.commits[i].branch !== branch) continue;
      const x = getCommitX(i) - scrollX;
      const isSelected = i === state.currentIndex;

      // Connecting line between consecutive nodes on same branch
      ctx.strokeStyle = color.line;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 1.5;
      for (let j = i + 1; j < state.commits.length; j++) {
        if (state.commits[j].branch !== branch) continue;
        const nx = getCommitX(j) - scrollX;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(nx, y);
        ctx.stroke();
        break;
      }
      ctx.globalAlpha = 1;

      // Node circle
      ctx.beginPath();
      ctx.arc(x, y, isSelected ? NODE_R + 3 : NODE_R, 0, Math.PI * 2);
      ctx.fillStyle = isSelected ? '#fff' : color.node;
      ctx.fill();
      if (isSelected) {
        ctx.strokeStyle = color.node;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Merge indicator (branch point)
      if (i > 0 && state.commits[i].branch !== state.commits[i-1].branch) {
        ctx.beginPath();
        ctx.arc(x, y, NODE_R + 5, 0, Math.PI * 2);
        ctx.strokeStyle = color.node;
        ctx.globalAlpha = 0.3;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Tag markers for releases
      if (state.commits[i].msg.startsWith('release:')) {
        ctx.fillStyle = '#ffc107';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🏷', x, y - 14);
      }
    }
  }

  // Update progress bar
  const pct = state.commits.length > 1 ? (state.currentIndex / (state.commits.length - 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${state.currentIndex + 1}/${state.commits.length}`;
}

// =====================================================================
//  Touch / Mouse Interaction
// =====================================================================
function getEventPos(e) {
  const rect = canvas.getBoundingClientRect();
  if (e.touches) {
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function getCommitAt(pos) {
  const branches = getBranches();
  for (let i = 0; i < state.commits.length; i++) {
    const cx = getCommitX(i) - scrollX;
    const cy = getBranchY(state.commits[i].branch, branches);
    const dx = pos.x - cx;
    const dy = pos.y - cy;
    if (dx * dx + dy * dy < 400) return i;
  }
  return -1;
}

function onPointerDown(e) {
  e.preventDefault();
  const pos = getEventPos(e);
  const idx = getCommitAt(pos);
  if (idx >= 0) {
    state.currentIndex = idx;
    if (state.isPlaying) { stopPlay(); }
    draw();
    showCommitDetail(idx);
    return;
  }
  // Start drag
  isDragging = true;
  dragStartX = pos.x;
  dragStartScroll = scrollX;
  canvas.style.cursor = 'grabbing';
}

function onPointerMove(e) {
  e.preventDefault();
  const pos = getEventPos(e);
  if (isDragging) {
    scrollX = dragStartScroll + (dragStartX - pos.x);
    const maxScroll = Math.max(0, LEFT_PAD + state.commits.length * 28 + RIGHT_PAD - W);
    scrollX = Math.max(0, Math.min(scrollX, maxScroll));
    draw();
    return;
  }
  // Hover
  const idx = getCommitAt(pos);
  canvas.style.cursor = idx >= 0 ? 'pointer' : 'default';
}

function onPointerUp(e) {
  isDragging = false;
  canvas.style.cursor = 'default';
}

// Mouse events
canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
canvas.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('mouseleave', onPointerUp);

// Touch events
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) onPointerDown(e);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) onPointerMove(e);
}, { passive: false });
canvas.addEventListener('touchend', onPointerUp, { passive: false });

// =====================================================================
//  Playback
// =====================================================================
function togglePlay() {
  if (state.isPlaying) { stopPlay(); }
  else { startPlay(); }
}

function startPlay() {
  state.isPlaying = true;
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('playBtn').classList.add('playing');
  state.lastFrame = performance.now();
  playLoop();
}

function stopPlay() {
  state.isPlaying = false;
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('playBtn').classList.remove('playing');
  if (state.animId) { cancelAnimationFrame(state.animId); state.animId = null; }
}

function playLoop(now) {
  if (!state.isPlaying) return;
  const elapsed = (now - state.lastFrame) / 1000;
  const step = state.speed * elapsed * 0.8; // commits per second
  if (elapsed > 0.05) {
    state.currentIndex = Math.min(state.currentIndex + Math.max(1, Math.round(step)), state.commits.length - 1);
    state.lastFrame = now;
    draw();
    if (state.currentIndex >= state.commits.length - 1) {
      stopPlay();
      state.currentIndex = 0;
      draw();
      return;
    }
  }
  state.animId = requestAnimationFrame(playLoop);
}

function setSpeed(s) {
  state.speed = s;
  document.querySelectorAll('.speed-btn').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.speed-btn').forEach(el => {
    if (el.textContent === s + '×') el.classList.add('active');
  });
}

function seekProgress(e) {
  const rect = document.getElementById('progressBar').getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  state.currentIndex = Math.round(pct * (state.commits.length - 1));
  if (state.isPlaying) stopPlay();
  draw();
  showCommitDetail(state.currentIndex);
}

function toggleSearch() {
  alert('搜索功能：按作者、关键词或时间范围筛选提交（实现中）');
}

function toggleExport() {
  alert('导出功能：生成 Markdown 报告或截图分享（实现中）');
}

// =====================================================================
//  Bottom Sheet — Commit Detail
// =====================================================================
const sheet = document.getElementById('bottomSheet');
const overlay = document.getElementById('sheetOverlay');

function showCommitDetail(index) {
  const c = state.commits[index];
  if (!c) return;

  document.getElementById('sheetTitle').textContent = c.msg;
  document.getElementById('sheetMeta').innerHTML = `
    <span>👤 ${c.author}</span>
    <span>🕐 ${c.date}</span>
    <span>📍 ${c.hash}</span>
  `;

  let html = '';

  // Branch tags
  html += `<div class="branch-tags">`;
  const branchClass = c.branch === 'main' ? 'main' : c.branch.startsWith('feat') ? 'feat' : c.branch.startsWith('fix') ? 'fix' : '';
  html += `<span class="branch-tag ${branchClass}">🌿 ${c.branch}</span>`;
  html += `</div>`;

  // AI Narration
  if (c.narr) {
    html += `<div class="narration">
      <div class="narration-label">🤖 AI 旁白</div>
      <div class="narration-text">${c.narr}</div>
    </div>`;
  }

  // File changes
  html += `<div class="file-list">`;
  for (const f of c.files) {
    const statType = f.a > 0 && f.d === 0 ? 'add' : f.d > 0 && f.a === 0 ? 'del' : 'mod';
    const statLabel = statType === 'add' ? `+${f.a}` : statType === 'del' ? `-${f.d}` : `+${f.a} -${f.d}`;
    html += `<div class="file-item" onclick="this.classList.toggle('open')">
      <span class="file-name">${f.n}</span>
      <span class="file-stat ${statType}">${statLabel}</span>
      <div class="file-diff">
        <span class="diff-add">+${'▌'.repeat(Math.min(f.a, 20))}</span>
        ${f.d > 0 ? '\n' + '<span class="diff-del">-' + '▌'.repeat(Math.min(f.d, 20)) + '</span>' : ''}
        <span style="color:var(--text2);display:block;margin-top:4px;">${f.a + f.d} 行变更</span>
      </div>
    </div>`;
  }
  html += `</div>`;

  // Stats summary
  const totalAdd = c.files.reduce((s, f) => s + f.a, 0);
  const totalDel = c.files.reduce((s, f) => s + f.d, 0);
  html += `<div style="display:flex;gap:12px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);">
    <span>📄 ${c.files.length} 个文件</span>
    <span class="file-stat add">+${totalAdd}</span>
    <span class="file-stat del">-${totalDel}</span>
  </div>`;

  document.getElementById('sheetBody').innerHTML = html;
  sheet.classList.add('open');
  overlay.classList.add('show');
}

function closeSheet() {
  sheet.classList.remove('open');
  overlay.classList.remove('show');
}

//  Auto-play hint
// =====================================================================
let hintTimer;
function showHint() {
  const hint = document.getElementById('hint');
  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 4000);
}

// =====================================================================
//  Init
// =====================================================================
resize();
showHint();

// Center on first commit
scrollX = 0;
draw();
</script>
