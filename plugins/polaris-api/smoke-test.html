<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Polaris API Panel Smoke Test</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #16181e; color: #d8dae2; font-family: 'JetBrains Mono', monospace; }
  #host { width: 100%; height: 600px; border: 1px solid #333; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/"
  }
}
</script>
</head>
<body>
<div id="host"></div>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom';
  import Panel from './dist/panel.js';
  const root = createRoot(document.getElementById('host'));
  root.render(React.createElement(Panel, {
    pluginId: 'polaris-api',
    onSendToChat: (msg) => { console.log('onSendToChat:', msg); document.getElementById('chat-log').textContent = msg; }
  }));
</script>
<div id="chat-log" style="position:fixed;bottom:0;left:0;right:0;background:#111;padding:8px;font-size:11px;color:#3fb950;max-height:60px;overflow:auto"></div>
</body>
</html>
