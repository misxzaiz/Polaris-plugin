<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 模型预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e; color: #eee; overflow: hidden;
  }
  #container { width: 100vw; height: 100vh; display: block; }
  #toolbar {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
    padding: 10px 18px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #toolbar button {
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    font-size: 13px; transition: all 0.2s;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.2); }
  #toolbar button.active { background: #4a9eff; }
  #info {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
    padding: 8px 20px; border-radius: 20px;
    font-size: 13px; color: #aaa; pointer-events: none;
  }
  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: #888;
  }
  #loading .spinner {
    width: 40px; height: 40px; margin: 0 auto 16px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #4a9eff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading.hidden { display: none; }
  #loading.error { color: #f66; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>加载模型...</div>
</div>

<div id="info">🖱 拖拽旋转 · 滚轮缩放 · 右键平移</div>
<div id="container"></div>

<div id="toolbar">
  <button id="btnReset">⟲ 复位</button>
  <button id="btnWireframe">◇ 线框</button>
  <button id="btnAutoRotate">⟳ 自转</button>
</div>

<script>
// ── 自包含 Three.js 预览（通过 script 标签加载 CDN 而非 import map）──
// 使用传统 script 加载代替 ES module，避免 import map 在 WebView2 中的兼容性问题

(function() {
  const container = document.getElementById('container');
  const loadingEl = document.getElementById('loading');

  // 动态加载 Three.js
  function loadScripts(urls, callback) {
    let i = 0;
    function next() {
      if (i >= urls.length) { callback(); return; }
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = next;
      s.onerror = () => { loadingEl.innerHTML = '<div class="error">❌ 加载 Three.js 失败，请检查网络</div>'; };
      document.head.appendChild(s);
    }
    next();
  }

  loadScripts([
    'https://unpkg.com/three@0.147.0/build/three.min.js',
    'https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js',
    'https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js',
  ], main);

  function main() {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 1.5;
    controls.maxDistance = 10;
    controls.update();

    // 光照
    scene.add(new THREE.AmbientLight(0x404060, 0.5));
    const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
    mainLight.position.set(4, 6, 3);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);
    const fillLight = new THREE.DirectionalLight(0x8888ff, 0.8);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
    rimLight.position.set(0, 1, -5);
    scene.add(rimLight);
    scene.add(new THREE.HemisphereLight(0x8888ff, 0x444422, 0.6));

    // 地面阴影
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(8, 8),
      new THREE.ShadowMaterial({ opacity: 0.3 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.3;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(4, 8, 0x6666aa, 0x444466);
    grid.position.y = -0.3;
    scene.add(grid);

    let model = null;
    let autoRotate = false;

    const modelPath = new URLSearchParams(window.location.search).get('model') || '';
    const loader = new THREE.GLTFLoader();

    loader.load(
      modelPath,
      (gltf) => {
        model = gltf.scene;
        scene.add(model);

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const minY = box.min.y;

        model.position.x -= center.x;
        model.position.z -= center.z;
        model.position.y -= minY;

        if (maxDim > 3) model.scale.setScalar(3 / maxDim);

        controls.target.set(0, size.y / 2, 0);
        camera.position.set(0, size.y * 0.7, maxDim * 2.2);
        controls.update();

        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        loadingEl.classList.add('hidden');
        console.log('✅ 模型加载完成:', modelPath);
      },
      (xhr) => {
        if (xhr.total) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          loadingEl.innerHTML = `<div class="spinner"></div><div>加载中 ${pct}%</div>`;
        }
      },
      (error) => {
        loadingEl.innerHTML = `<div class="error">❌ 加载失败: ${error.message}</div>`;
        console.error('❌ 模型加载失败:', error);
      }
    );

    // 按钮
    document.getElementById('btnReset').addEventListener('click', () => {
      camera.position.set(0, 1.5, 4);
      controls.target.set(0, 0.5, 0);
      controls.update();
    });

    document.getElementById('btnWireframe').addEventListener('click', () => {
      const btn = document.getElementById('btnWireframe');
      const isWire = btn.classList.toggle('active');
      if (model) {
        model.traverse((child) => {
          if (child.isMesh) child.material.wireframe = isWire;
        });
      }
    });

    document.getElementById('btnAutoRotate').addEventListener('click', () => {
      autoRotate = !autoRotate;
      document.getElementById('btnAutoRotate').classList.toggle('active', autoRotate);
    });

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    function animate() {
      requestAnimationFrame(animate);
      if (autoRotate) {
        const pivot = controls.target;
        const radius = camera.position.distanceTo(pivot);
        const angle = performance.now() / 10000;
        camera.position.x = pivot.x + radius * Math.sin(angle);
        camera.position.z = pivot.z + radius * Math.cos(angle);
        camera.lookAt(pivot);
      }
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  }
})();
</script>
</body>
</html>
